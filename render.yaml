services:
  - type: web
    name: nxcar-ultra
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium || true
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: NXCAR_PHONE
        value: "9816072037"
      - key: PYTHON_VERSION
        value: "3.11.0"
